<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{w}}, height={{h}}">
<title>Trình chiếu ba ý</title>
<script src="__hf/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{w}}px;height:{{h}}px;overflow:hidden;background:#101426;font-family:"Be Vietnam Pro",sans-serif}
#root{position:relative;width:{{w}}px;height:{{h}}px;overflow:hidden;background:#101426;color:#fff}
.slide{position:absolute;left:0;top:0;width:{{w}}px;height:{{h}}px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;padding:90px 30px 110px}
.a-l .slide{padding:50px 60px 60px;gap:12px}
.a-s .slide{padding:60px 28px 56px;gap:10px}
#sl1{background:linear-gradient(160deg,#16215a,#2b3f9c)}
#sl2{background:linear-gradient(160deg,#4a1670,#9c2fa0)}
#sl3{background:linear-gradient(160deg,#0f4b52,#1b9a8a)}
.num{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--hf-accent,#5b8cff);background:#fff;padding:5px 14px;border-radius:20px}
h2{font-size:36px;line-height:1.15;font-weight:800}
.a-l h2{font-size:42px}.a-s h2{font-size:30px}
.txt{font-size:19px;line-height:1.45;color:#e8ecff;max-width:520px}
.a-s .txt{font-size:16px}
.brand{position:absolute;left:30px;top:44px;font-size:14px;font-weight:700;letter-spacing:1px;opacity:.9}
.a-l .brand{left:60px;top:26px}.a-s .brand{left:28px;top:22px}
.track{position:absolute;left:0;bottom:0;width:{{w}}px;height:6px;background:rgba(255,255,255,.2)}
#bar{width:{{w}}px;height:6px;background:var(--hf-accent,#5b8cff);transform-origin:0 50%}
</style>
</head>
<body>
<div id="root" class="{{aspect}}" data-composition-id="main" data-start="0" data-duration="{{d}}" data-width="{{w}}" data-height="{{h}}">
  <div id="sl1" class="clip slide" data-start="0" data-duration="{{d:0.34}}">
    <span class="num">1 / 3</span>
    <h2 id="t1" data-hf-var="slide1_title">Chất lượng ổn định</h2>
    <p id="x1" class="txt" data-hf-var="slide1_text">Chọn lọc kỹ từ khâu nguyên liệu đến thành phẩm.</p>
  </div>
  <div id="sl2" class="clip slide" data-start="{{d:0.34}}" data-duration="{{d:0.33}}">
    <span class="num">2 / 3</span>
    <h2 id="t2" data-hf-var="slide2_title">Giá hợp lý</h2>
    <p id="x2" class="txt" data-hf-var="slide2_text">Minh bạch giá, không phát sinh chi phí ẩn.</p>
  </div>
  <div id="sl3" class="clip slide" data-start="{{d:0.67}}" data-duration="{{r:0.67}}">
    <span class="num">3 / 3</span>
    <h2 id="t3" data-hf-var="slide3_title">Hỗ trợ tận tâm</h2>
    <p id="x3" class="txt" data-hf-var="slide3_text">Đội ngũ luôn sẵn sàng giải đáp mọi thắc mắc của bạn.</p>
  </div>
  <p id="brand" class="clip brand" data-start="0" data-duration="{{d}}" data-hf-var="brand_name">Thương hiệu của bạn</p>
  <div id="track" class="clip track" data-start="0" data-duration="{{d}}"><div id="bar"></div></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const D = {{d}};
const T = (f) => Math.round(D * f * 100) / 100;
const tl = gsap.timeline({ paused: true });
tl.from("#brand", { opacity: 0, y: -12, duration: 0.5 }, 0.1);
tl.from("#bar", { scaleX: 0, duration: D, ease: "none" }, 0);
[["sl1", "t1", "x1", 0], ["sl2", "t2", "x2", 0.34], ["sl3", "t3", "x3", 0.67]].forEach(([s, t, x, f], i) => {
  const at = T(f);
  tl.from("#" + s + " .num", { scale: 0.5, opacity: 0, duration: 0.4, ease: "back.out(2)" }, at + 0.1);
  tl.from("#" + t, { x: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, at + 0.2);
  tl.from("#" + x, { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" }, at + 0.5);
  if (i < 2) tl.to("#" + s, { opacity: 0, duration: 0.3 }, T([0.34, 0.67][i]) - 0.3);
});
window.__timelines["main"] = tl;
</script>
</body>
</html>
