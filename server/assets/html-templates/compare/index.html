<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{w}}, height={{h}}">
<title>So sánh</title>
<script src="__hf/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{w}}px;height:{{h}}px;overflow:hidden;background:#0e1b2c;font-family:"Be Vietnam Pro",sans-serif}
#root{position:relative;width:{{w}}px;height:{{h}}px;overflow:hidden;background:linear-gradient(170deg,#0e1b2c 0%,#12304a 100%);color:#fff}
#cmp{position:absolute;left:0;top:0;width:{{w}}px;height:{{h}}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:64px 22px 110px}
.a-l #cmp{padding:28px 40px 70px;gap:14px}
.a-s #cmp{padding:20px 20px 60px;gap:10px}
h1{font-size:28px;font-weight:800;text-align:center;line-height:1.2}
.a-l h1{font-size:30px}.a-s h1{font-size:22px}
.cards{display:flex;flex-direction:column;gap:14px;width:100%}
.a-l .cards{flex-direction:row;gap:22px}
.a-s .cards{gap:8px}
.card{flex:1;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.a-s .card{padding:10px 14px;gap:5px;border-radius:16px}
.card.a{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.card.b{background:linear-gradient(145deg,var(--hf-brand,#22c58b),#0f8a62);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.label{font-size:17px;font-weight:700}
.a-s .label{font-size:14px}
.row{font-size:15px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.a-s .row{font-size:12.5px;gap:6px}
.row i{font-style:normal;font-weight:800;flex:none;width:18px}
.cta{position:absolute;left:50%;bottom:96px;margin-left:-130px;width:260px;font-size:19px;font-weight:700;text-align:center;color:#0e1b2c;background:#fff;padding:12px 0;border-radius:40px}
.a-l .cta{bottom:24px}.a-s .cta{bottom:12px;font-size:15px;padding:8px 0;margin-left:-110px;width:220px}
</style>
</head>
<body>
<div id="root" class="{{aspect}}" data-composition-id="main" data-start="0" data-duration="{{d}}" data-width="{{w}}" data-height="{{h}}">
  <div id="cmp" class="clip" data-start="0" data-duration="{{d}}">
    <h1 id="title" data-hf-var="title">So sánh nhanh</h1>
    <div class="cards">
      <div id="ca" class="card a">
        <p class="label" data-hf-var="label_a">Cách thông thường</p>
        <p id="a1" class="row"><i>×</i><span>Mất nhiều thời gian</span></p>
        <p id="a2" class="row"><i>×</i><span>Chi phí khó kiểm soát</span></p>
        <p id="a3" class="row"><i>×</i><span>Kết quả không ổn định</span></p>
      </div>
      <div id="cb" class="card b">
        <p class="label" data-hf-var="label_b">Sản phẩm của chúng tôi</p>
        <p id="b1" class="row"><i>+</i><span>Nhanh gọn trong vài phút</span></p>
        <p id="b2" class="row"><i>+</i><span>Giá rõ ràng, minh bạch</span></p>
        <p id="b3" class="row"><i>+</i><span>Kết quả đồng đều mỗi lần</span></p>
      </div>
    </div>
  </div>
  <div id="cta" class="clip cta" data-start="{{d:0.72}}" data-duration="{{r:0.72}}" data-hf-var="cta">Trải nghiệm ngay</div>
</div>
<script>
window.__timelines = window.__timelines || {};
const D = {{d}};
const T = (f) => Math.round(D * f * 100) / 100;
const tl = gsap.timeline({ paused: true });
tl.from("#title", { y: -24, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.1);
tl.from("#ca", { x: -50, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.4);
tl.from("#cb", { x: 50, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.6);
tl.from("#a1,#b1", { opacity: 0, y: 12, duration: 0.4 }, T(0.2) + 0.5);
tl.from("#a2,#b2", { opacity: 0, y: 12, duration: 0.4 }, T(0.2) + 1.0);
tl.from("#a3,#b3", { opacity: 0, y: 12, duration: 0.4 }, T(0.2) + 1.5);
tl.from("#cta", { y: 40, opacity: 0, duration: 0.5, ease: "back.out(1.6)" }, T(0.72) + 0.05);
tl.to("#cta", { scale: 1.06, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, T(0.72) + 0.7);
window.__timelines["main"] = tl;
</script>
</body>
</html>
